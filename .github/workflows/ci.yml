name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger, so a commit whose push webhook was dropped can still be built and deployed.
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      EVM_RPC_URL: http://127.0.0.1:8545
      GITHUB_WEBHOOK_SECRET: ci_webhook_secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx drizzle-kit push --force
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run build:sdk
      - run: npx @redocly/cli lint public/openapi.yaml

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # www.keenetix.xyz is served by Vercel. This step used to run `railway up --detach`, which
    # returned success as soon as the upload finished, on a host that does not serve the domain --
    # so CI reported a green deploy while production stayed ten days stale.
    env:
      VERCEL_ORG_ID: team_SSytJKkFTl57FMrw5WJEPZ73
      VERCEL_PROJECT_ID: prj_FOrmnapYsBfHZb9144eYK1HHb24b
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g vercel@latest
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: NEXT_PUBLIC_BUILD_SHA="$GITHUB_SHA" vercel build --prod --token="$VERCEL_TOKEN"
      # No --detach: the job should fail if the deployment does.
      - name: Deploy to production
        run: |
          URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deployed $URL" >> $GITHUB_STEP_SUMMARY
          echo "url=$URL" >> $GITHUB_OUTPUT
        id: deploy
      # Checking for a fixed string is useless -- it passes even when production rolls backwards,
      # which is exactly what happened. Compare the commit the site reports against this one.
      - name: Verify production is serving this commit
        run: |
          for attempt in $(seq 1 10); do
            LIVE=$(curl -sf "https://www.keenetix.xyz/?cachebust=${GITHUB_SHA}" \
              | grep -o 'name="keenetix-build" content="[0-9a-f]*"' | grep -o '[0-9a-f]\{7,\}' || true)
            if [ "$LIVE" = "$GITHUB_SHA" ]; then
              echo "Production is serving ${GITHUB_SHA}." && exit 0
            fi
            echo "Production reports '${LIVE:-none}', waiting for ${GITHUB_SHA}…"
            sleep 15
          done
          echo "::error::Production is serving '${LIVE:-none}', not ${GITHUB_SHA}."
          exit 1
