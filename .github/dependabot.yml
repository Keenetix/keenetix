version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      types:
        patterns: ["@types/*"]
      dev-tooling:
        patterns: ["eslint*", "typescript", "vitest", "postcss", "tailwindcss", "@tailwindcss/*"]
    ignore:
      # Framework majors are upgraded deliberately, not by bot.
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
