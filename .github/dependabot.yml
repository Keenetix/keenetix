version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      types:
        patterns: ["@types/*"]
      dev-tooling:
        patterns: ["eslint*", "typescript", "vitest", "postcss", "tailwindcss", "@tailwindcss/*"]
    ignore:
      # Majors are upgraded deliberately. Dependabot's generated lockfiles for
      # major bumps have repeatedly landed out of sync with package.json, and a
      # major here can remove compiler options the build depends on.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
